name: Plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    permissions:
      contents: write
    uses: URA-Plugins/.github/.github/workflows/plugin.yml@927fa76bae243fc22cc6fa4e09a0e4754f096abb
    with:
      project: SendGameStatusPlugin.csproj
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
